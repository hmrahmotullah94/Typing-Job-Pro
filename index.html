<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#1a237e">

<title>
Typing Job Pro v9.0 - Rahmotullah
</title>


<link rel="manifest" href="manifest.json">


<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700;900&family=Hind+Siliguri:wght@400;700;900&display=swap" rel="stylesheet">


<style>

@font-face{
font-family:Nikosh;
src:url("https://cdn.jsdelivr.net/gh/p90/font-nikosh@master/Nikosh.ttf");
}


@font-face{
font-family:SolaimanLipi;
src:url("https://cdn.jsdelivr.net/gh/atulkumarsingh/fonts@master/SolaimanLipi.ttf");
}



:root{

--primary:#1a237e;
--accent:#00b8d4;

--bg:#e8eef5;

--card:white;

--text:#222;

--typing:#050505;

--typingText:#00ff99;

}



[data-theme="dark"]{

--bg:#050505;

--card:#111;

--text:white;

--typing:#000;

}



[data-theme="midnight"]{

--bg:#071426;

--card:#102542;

--text:white;

--typing:#020c18;

}



*{
box-sizing:border-box;
}



body{

margin:0;

padding:15px;

background:var(--bg);

color:var(--text);

font-family:

"Noto Sans Bengali",
"Hind Siliguri",
sans-serif;

transition:.3s;

}




.app{

max-width:1100px;

margin:auto;

background:var(--card);

padding:25px;

border-radius:25px;

box-shadow:

0 20px 50px #0003;

}




.header{

text-align:center;

}



.logo{

font-size:40px;

font-weight:900;

color:var(--primary);

}



.subtitle{

font-size:18px;

font-weight:bold;

color:var(--accent);

}



.creator{

line-height:1.8;

margin-top:10px;

}




.fb{

display:inline-flex;

width:40px;

height:40px;

border-radius:50%;

background:#1877f2;

color:white;

align-items:center;

justify-content:center;

font-size:22px;

text-decoration:none;

}





.settings-btn{

position:fixed;

right:20px;

top:20px;

height:58px;

width:58px;

background:var(--accent);

color:white;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

cursor:pointer;

z-index:9999;

}





.sidebar{

position:fixed;

right:-380px;

top:0;

width:360px;

height:100%;

background:var(--card);

padding:25px;

box-shadow:-10px 0 30px #0005;

transition:.4s;

overflow:auto;

z-index:9998;

}



.sidebar.active{

right:0;

}





label{

display:block;

font-weight:bold;

margin-top:15px;

}



select,
input,
textarea,
button{

width:100%;

padding:12px;

margin-top:8px;

border-radius:12px;

font-size:16px;

font-family:inherit;

}



button{

background:var(--primary);

color:white;

border:none;

font-weight:bold;

cursor:pointer;

}




.control-panel{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:12px;

margin-top:25px;

}




.typing-display{


margin-top:25px;

background:var(--typing);

color:var(--typingText);

padding:25px;

border-radius:18px;

min-height:200px;

font-size:30px;

line-height:2;


font-family:

"Noto Sans Bengali",
Nikosh,
SolaimanLipi,
sans-serif;



white-space:pre-wrap;

word-break:normal;

overflow:auto;


border-left:

8px solid var(--accent);


}





#typingInput{

width:100%;

height:140px;

margin-top:20px;

padding:15px;

font-size:24px;

resize:none;


font-family:

"Noto Sans Bengali",
Nikosh,
SolaimanLipi,
sans-serif;


background:var(--card);

color:var(--text);


border:

3px solid var(--primary);


}




.stats{

display:grid;

grid-template-columns:

repeat(4,1fr);

gap:12px;

margin-top:20px;

}



.stat{

background:var(--primary);

color:white;

padding:15px;

border-radius:15px;

text-align:center;

font-weight:bold;

}



.stat span{

display:block;

font-size:28px;

color:#ffeb3b;

}




.custom-item{

background:#eee;

padding:10px;

margin-top:10px;

border-radius:10px;

}





@media(max-width:700px){


.logo{

font-size:28px;

}


.control-panel{

grid-template-columns:1fr;

}



.stats{

grid-template-columns:

repeat(2,1fr);

}



.typing-display{

font-size:22px;

}



.sidebar{

width:90%;

}


}



</style>


</head>

paragraph:[

"বাংলাদেশ একটি স্বাধীন সার্বভৌম দেশ। এ দেশের মানুষ পরিশ্রমী ও কর্মঠ। শিক্ষার মাধ্যমে একটি জাতি উন্নতির পথে এগিয়ে যায়।",
 "তথ্যপ্রযুক্তির দ্রুত বিকাশের ফলে বিশ্বজুড়ে অর্থনৈতিক কর্মকাণ্ডে নতুন দিগন্ত উন্মোচিত হয়েছে। ডিজিটাল অর্থনীতির যুগে তরুণ সমাজের ভূমিকা দিন দিন বৃদ্ধি পাচ্ছে।",
  "জলবায়ু পরিবর্তনের চ্যালেঞ্জ মোকাবিলায় সবুজ শক্তি ব্যবহারের কোনো বিকল্প নেই। নবায়নযোগ্য শক্তির ব্যবহার ভবিষ্যতে কার্বন নিঃসরণ কমাতে মূল ভূমিকা রাখবে।",
  "শিক্ষা ব্যবস্থায় ডিজিটালাইজেশন শিক্ষার্থীদের শেখার প্রক্রিয়াকে আরও সহজ ও আনন্দদায়ক করেছে। অনলাইন শিক্ষার মাধ্যমে দূরবর্তী অঞ্চলের শিক্ষার্থীরাও মানসম্মত শিক্ষা পাচ্ছে।",
  "কৃষি খাতে আধুনিক প্রযুক্তির ব্যবহারে দেশে খাদ্য উৎপাদন উল্লেখযোগ্যভাবে বৃদ্ধি পেয়েছে। স্মার্ট কৃষির ছোঁয়া কৃষকদের ফলন ও আয় বাড়াতে সাহায্য করছে।",
  "স্বাস্থ্যসেবায় আর্টিফিশিয়াল ইন্টেলিজেন্স বা কৃত্রিম বুদ্ধিমত্তার ব্যবহার জটিল রোগ নির্ণয়কে আরও দ্রুত ও নির্ভুল করে তুলছে।",
  "বিশ্বজুড়ে টেকসই উন্নয়নের লক্ষ্যে প্লাস্টিকের ব্যবহার কমানোর ওপর জোর দেওয়া হচ্ছে। পরিবেশবান্ধব পণ্যের ব্যবহার বাড়াতে সামাজিক সচেতনতা জরুরি।",
  "খেলাধুলা তরুণদের শারীরিক ও মানসিক বিকাশে অপরিসীম ভূমিকা পালন করে। সঠিক প্রশিক্ষণ ও সুযোগ পেলে আন্তর্জাতিক অঙ্গনে দেশের মুখ উজ্জ্বল করা সম্ভব।",
  "পর্যটন শিল্পের বিকাশ একটি দেশের অর্থনৈতিক ভিত্তি মজবুত করতে সাহায্য করে। ঐতিহাসিক ও প্রাকৃতিক স্থানগুলোর সঠিক পরিচর্যা পর্যটকদের আকর্ষণ করে।",
  "বই পড়ার অভ্যাস মানুষের চিন্তাভাবনা ও জ্ঞানের পরিধি প্রসারিত করে। ডিজিটাল যুগের ব্যস্ততার মাঝেও সাহিত্য চর্চা মানুষকে মানসিক প্রশান্তি দেয়।",
  "আন্তর্জাতিক বাজারে তৈরি পোশাক শিল্পের চাহিদা ধরে রাখতে পণ্যের গুণগত মান বজায় রাখা অত্যন্ত জরুরি। নতুন প্রযুক্তি ব্যবহারে উৎপাদনশীলতা বাড়ানো প্রয়োজন।",
  "মহাকাশ গবেষণায় নতুন নতুন আবিস্কার মানবজাতির ভবিষ্যতের জন্য নতুন সম্ভাবনার পথ খুলে দিচ্ছে। স্যাটেলাইট প্রযুক্তির উন্নতির ফলে যোগাযোগ ব্যবস্থা সহজ হয়েছে।",
  "শহরাঞ্চলের যানবাহন নিয়ন্ত্রণ ও ট্রাফিক সমস্যা নিরসনে পরিকল্পিত পরিবহন ব্যবস্থা গড়ে তোলা প্রয়োজন। গণপরিবহনের মান বাড়ালে যানজট অনেকটাই কমে আসবে।",
  "সামাজিক যোগাযোগ মাধ্যম বর্তমান সময়ে তথ্যের আদান-প্রদানে গুরুত্বপূর্ণ ভূমিকা রাখছে। তবে ভুয়া খবর ছড়িয়ে পড়া রোধে সচেতনতা প্রয়োজন।",
  "নদীমাতৃক এই দেশে নদীদূষণ রোধ করা পরিবেশ রক্ষার অন্যতম প্রধান দায়িত্ব। শিল্পবর্জ্য নদীতে ফেলা বন্ধ করতে কঠোর পদক্ষেপ গ্রহণ করতে হবে।",
  "ব্যাংকিং খাতে ডিজিটাল সেবার প্রসারের ফলে মানুষ এখন ঘরে বসেই অর্থনৈতিক লেনদেন সম্পন্ন করতে পারছে। এতে মানুষের সময় ও শ্রম উভয়ই বাঁচছে।",
  "ক্ষুদ্র ও মাঝারি শিল্প দেশের সার্বিক অর্থনীতিকে সচল রাখতে চালিকাশক্তি হিসেবে কাজ করে। নতুন উদ্যোক্তাদের উৎসাহিত করতে সহজ ঋণের ব্যবস্থা করা দরকার।",
  "স্মার্ট সিটি নির্মাণে ডিজিটাল অবকাঠামো এবং প্রযুক্তিনির্ভর নাগরিক সেবা নিশ্চিত করা জরুরি। এতে শহরের মানুষের জীবনযাত্রার মান বহুগুণ বেড়ে যায়।",
  "সৌরবিদ্যুৎ ও বায়ুবিদ্যুতের মতো প্রাকৃতিক শক্তির ব্যবহার পরিবেশের ভারসাম্য বজায় রাখতে সাহায্য করে। গ্রিন এনার্জির প্রসার ভবিষ্যৎ প্রজন্মের জন্য নিরাপদ।",
  "গবেষণা ও উদ্ভাবন একটি জাতির অগ্রগতির অন্যতম সূচক। বিজ্ঞান ও প্রযুক্তি গবেষণায় বাজেট বৃদ্ধি করলে নতুন নতুন আবিষ্কার সম্ভব।",
  "বনায়ন কর্মসূচির মাধ্যমে বনাঞ্চল বৃদ্ধি করা জলবায়ু পরিবর্তনের প্রভাব কমাতে দারুণ কার্যকরী। গাছ লাগানো ও বন রক্ষায় সবার এগিয়ে আসা উচিত।",
  "সাইবার নিরাপত্তা বজায় রাখা বর্তমান ডিজিটাল বিশ্বের জন্য সবচেয়ে বড় চ্যালেঞ্জ। ব্যক্তি ও প্রতিষ্ঠানের সংবেদনশীল তথ্য সুরক্ষায় সতর্ক থাকা প্রয়োজন।",
  "সাংস্কৃতিক চর্চা ঐতিহ্যকে বাঁচিয়ে রাখতে সহায়তা করে। নিজস্ব সংস্কৃতি ও শিল্পকলাকে বিশ্বদরবারে তুলে ধরার জন্য তরুণ প্রজন্মকে এগিয়ে আসতে হবে।",
  "মেডিকেল বিজ্ঞানের গবেষণায় অসংক্রামক রোগ প্রতিরোধে নতুন ওষুধ ও চিকিৎসা পদ্ধতি উদ্ভাবন হচ্ছে, যা মানুষের গড় আয়ু বৃদ্ধিতে অবদান রাখছে।",
  "শ্রমিকদের নিরাপত্তা ও কর্মপরিবেশ উন্নত করা টেকসই শিল্প উন্নয়নের অন্যতম পূর্বশর্ত। নিরাপদ কর্মক্ষেত্র কাজের গতি ও মান বাড়িয়ে দেয়।",
  "খাদ্য নিরাপত্তার পাশাপাশি পুষ্টিকর খাবার সরবরাহ নিশ্চিত করা অত্যন্ত প্রয়োজন। ভেজালমুক্ত খাদ্য উৎপাদন জনস্বাস্থ্যের জন্য অপরিহার্য।",
  "মহাকাশে কৃত্রিম উপগ্রহ পাঠাল নতুন উচ্চতায় পৌঁছে দিচ্ছে যোগাযোগ প্রযুক্তিকে। এর ফলে ইন্টারনেট সেবা এবং আবহাওয়া পূর্বাভাস পাওয়া সহজ হচ্ছে।",

/***********************
 ELEMENTS
************************/


const display=
document.getElementById("display");


const input=
document.getElementById("typingInput");


const language=
document.getElementById("language");


const mode=
document.getElementById("practiceMode");


const lesson=
document.getElementById("lessonSelect");


const theme=
document.getElementById("themeSelect");


const font=
document.getElementById("fontSelect");


const fontsize=
document.getElementById("fontSize");



let targetText="";

let lessonIndex=0;

let timer=null;

let startTime=null;

let running=false;

let finished=false;





/***********************
 LOAD LESSON
************************/


function loadText(){


let lang=
language.value;


let type=
mode.value;



if(type==="custom"){


let list=
JSON.parse(
localStorage.getItem("custom_text")
||"[]"
);


targetText=
list[lessonIndex] ||
"কোনো Custom Text নেই";


}

else{


targetText=
database[lang][type][lessonIndex]
||
"";


}



display.textContent=
targetText;


reset();


}





/***********************
 RESET
************************/


function reset(){


clearInterval(timer);


input.value="";


running=false;

finished=false;


startTime=null;


document.getElementById("time").innerText="0";

document.getElementById("wpm").innerText="0";

document.getElementById("accuracy").innerText="100%";

document.getElementById("error").innerText="0";


}





/***********************
 CHECK TYPING
************************/


function checkTyping(){


let typed=input.value;


let correct=0;

let error=0;



for(let i=0;i<typed.length;i++){


if(typed[i]===targetText[i])

correct++;

else

error++;


}



let accuracy=

typed.length?

Math.round(
(correct/typed.length)*100
):

100;



document.getElementById("accuracy")
.innerText=
accuracy+"%";


document.getElementById("error")
.innerText=
error;



display.textContent=
targetText;



if(typed.length>=targetText.length)

finish();


}






/***********************
 INPUT EVENT
************************/


input.addEventListener(
"input",
()=>{


if(!running)

startTimer();



checkTyping();


});






/***********************
 TIMER
************************/


function startTimer(){


running=true;


startTime=
Date.now();



timer=setInterval(()=>{


let sec=

Math.floor(
(Date.now()-startTime)/1000
);



document.getElementById("time")
.innerText=
sec;


calculateWPM();


},1000);


}






/***********************
 WPM
************************/


function calculateWPM(){


let sec=
Number(
document.getElementById("time").innerText
);


if(sec<=0)
return;


let chars=
input.value.length;



let wpm=

Math.round(
(chars/5)/(sec/60)
);



document.getElementById("wpm")
.innerText=
wpm;


}






/***********************
 FINISH
************************/


function finish(){


if(finished)
return;


finished=true;


clearInterval(timer);



saveHistory();



setTimeout(()=>{


alert(

"Completed\n\nWPM : "

+
document.getElementById("wpm").innerText

+

"\nAccuracy : "

+
document.getElementById("accuracy").innerText

);



nextLesson();



},300);


}







/***********************
 NEXT LESSON
************************/


function nextLesson(){


lessonIndex++;


let lang=
language.value;


let type=
mode.value;


let total;


if(type==="custom"){


total=

JSON.parse(
localStorage.getItem("custom_text")
||"[]"
).length;


}

else{


total=
database[lang][type].length;


}



if(lessonIndex>=total)

lessonIndex=0;



lesson.value=
lessonIndex;


loadText();


}






/***********************
 LESSON LIST
************************/


function updateLessons(){


lesson.innerHTML="";


let lang=
language.value;


let type=
mode.value;



let total;


if(type==="custom"){


total=

JSON.parse(
localStorage.getItem("custom_text")
||"[]"
).length;


}

else{


total=
database[lang][type].length;


}



for(let i=0;i<total;i++){


let option=
document.createElement("option");


option.value=i;


option.textContent=
"Lesson "+(i+1);


lesson.appendChild(option);


}



}







/***********************
 CUSTOM TEXT
************************/


function saveCustom(){


let text=
document.getElementById("customText")
.value
.trim();



if(!text)
return;



let data=

JSON.parse(
localStorage.getItem("custom_text")
||"[]"
);



data.push(text);



localStorage.setItem(

"custom_text",

JSON.stringify(data)

);



document.getElementById("customText")
.value="";



alert(
"Custom Text Saved"
);



updateLessons();


}







/***********************
 BIJOY INPUT
************************/


input.addEventListener(
"keydown",
function(e){


if(language.value!=="bn")
return;



if(
e.ctrlKey ||
e.altKey ||
e.key.length>1
)

return;



if(bijoy[e.key]){


e.preventDefault();



let pos=this.selectionStart;



this.value=

this.value.substring(0,pos)

+

bijoy[e.key]

+

this.value.substring(pos);



this.selectionStart=

this.selectionEnd=

pos+1;



this.dispatchEvent(
new Event("input")
);


}


});







/***********************
 SETTINGS
************************/


theme.onchange=function(){


document.documentElement
.setAttribute(
"data-theme",
this.value
);



localStorage.setItem(
"theme",
this.value
);


};




font.onchange=function(){


display.style.fontFamily=this.value;

input.style.fontFamily=this.value;


localStorage.setItem(
"font",
this.value
);


};




fontsize.onchange=function(){


display.style.fontSize=
this.value+"px";


input.style.fontSize=
this.value+"px";


localStorage.setItem(
"size",
this.value
);


};






function applySettings(){


let t=
localStorage.getItem("theme");


if(t){

document.documentElement
.setAttribute(
"data-theme",
t
);

theme.value=t;

}



let f=
localStorage.getItem("font");


if(f){

display.style.fontFamily=f;

input.style.fontFamily=f;

font.value=f;

}



let s=
localStorage.getItem("size");


if(s){

display.style.fontSize=s+"px";

input.style.fontSize=s+"px";

fontsize.value=s;


}



}






/***********************
 CHANGE EVENTS
************************/


language.onchange=function(){

lessonIndex=0;

updateLessons();

loadText();

};



mode.onchange=function(){

lessonIndex=0;

updateLessons();

loadText();

};



lesson.onchange=function(){


lessonIndex=
Number(this.value);


loadText();


};







/***********************
 HISTORY
************************/


function saveHistory(){


let h=

JSON.parse(
localStorage.getItem("history")
||"[]"
);



h.push({

date:new Date()
.toLocaleString(),

wpm:
document.getElementById("wpm").innerText,


accuracy:
document.getElementById("accuracy").innerText


});



localStorage.setItem(
"history",
JSON.stringify(h)
);


}







/***********************
 SETTINGS BUTTON
************************/


function toggleSettings(){


document
.getElementById("settings")
.classList
.toggle("active");


}

 START
************************/


window.onload=function(){


applySettings();

updateLessons();

loadText();


};

window.addEventListener(

navigator.serviceWorker.register(

);


})


});


}
