<html lang="bn">

<head>

<title>
Typing Job Pro v9.0 - Rahmotullah
</title>


<link rel="manifest" href="manifest.json">

<style>

@font-face{
font-family:Nikosh;
src:url("https://cdn.jsdelivr.net/gh/p90/font-nikosh@master/Nikosh.ttf");
}


@font-face{
font-family:SolaimanLipi;
src:url("https://cdn.jsdelivr.net/gh/atulkumarsingh/fonts@master/SolaimanLipi.ttf");
}



:root{

--primary:#1a237e;
--accent:#00b8d4;

--bg:#e8eef5;

--card:white;

--text:#222;

--typing:#050505;

--typingText:#00ff99;

}



[data-theme="dark"]{

--bg:#050505;

--card:#111;

--text:white;

--typing:#000;

}



[data-theme="midnight"]{

--bg:#071426;

--card:#102542;

--text:white;

--typing:#020c18;

}



*{
box-sizing:border-box;
}



body{

margin:0;

padding:15px;

background:var(--bg);

color:var(--text);

font-family:

"Noto Sans Bengali",
"Hind Siliguri",
sans-serif;

transition:.3s;

}




.app{

max-width:1100px;

margin:auto;

background:var(--card);

padding:25px;

border-radius:25px;

box-shadow:

0 20px 50px #0003;

}




.header{

text-align:center;

}



.logo{

font-size:40px;

font-weight:900;

color:var(--primary);

}



.subtitle{

font-size:18px;

font-weight:bold;

color:var(--accent);

}



.creator{

line-height:1.8;

margin-top:10px;

}




.fb{

display:inline-flex;

width:40px;

height:40px;

border-radius:50%;

background:#1877f2;

color:white;

align-items:center;

justify-content:center;

font-size:22px;

text-decoration:none;

}





.settings-btn{

position:fixed;

right:20px;

top:20px;

height:58px;

width:58px;

background:var(--accent);

color:white;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

cursor:pointer;

z-index:9999;

}





.sidebar{

position:fixed;

right:-380px;

top:0;

width:360px;

height:100%;

background:var(--card);

padding:25px;

box-shadow:-10px 0 30px #0005;

transition:.4s;

overflow:auto;

z-index:9998;

}



.sidebar.active{

right:0;

}





label{

display:block;

font-weight:bold;

margin-top:15px;

}



select,
input,
textarea,
button{

width:100%;

padding:12px;

margin-top:8px;

border-radius:12px;

font-size:16px;

font-family:inherit;

}



button{

background:var(--primary);

color:white;

border:none;

font-weight:bold;

cursor:pointer;

}




.control-panel{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:12px;

margin-top:25px;

}




.typing-display{


margin-top:25px;

background:var(--typing);

color:var(--typingText);

padding:25px;

border-radius:18px;

min-height:200px;

font-size:30px;

line-height:2;


font-family:

"Noto Sans Bengali",
Nikosh,
SolaimanLipi,
sans-serif;



white-space:pre-wrap;

word-break:normal;

overflow:auto;


border-left:

8px solid var(--accent);


}





#typingInput{

width:100%;

height:140px;

margin-top:20px;

padding:15px;

font-size:24px;

resize:none;


font-family:

"Noto Sans Bengali",
Nikosh,
SolaimanLipi,
sans-serif;


background:var(--card);

color:var(--text);


border:

3px solid var(--primary);


}




.stats{

display:grid;

grid-template-columns:

repeat(4,1fr);

gap:12px;

margin-top:20px;

}



.stat{

background:var(--primary);

color:white;

padding:15px;

border-radius:15px;

text-align:center;

font-weight:bold;

}



.stat span{

display:block;

font-size:28px;

color:#ffeb3b;

}




.custom-item{

background:#eee;

padding:10px;

margin-top:10px;

border-radius:10px;

}





@media(max-width:700px){


.logo{

font-size:28px;

}


.control-panel{

grid-template-columns:1fr;

}



.stats{

grid-template-columns:

repeat(2,1fr);

}



.typing-display{

font-size:22px;

}



.sidebar{

width:90%;

}


}



</style>


</head>



<body>

onclick="toggleSettings()">

Settings
</h2>

Theme

Save Custom Text

<div class="app">



<div class="header">


<div class="logo">

<div class="subtitle">

Professional Bangla & English Typing Trainer

</div>



<div class="creator">

Developed By <b>Rahmotullah</b>

<br>

CST-6, University of Rajshahi

<br>

href="https://www.facebook.com/rahmotullah.ru.bd"
target="_blank">

f

</div>


</div>






<div class="control-panel">


<select id="language">


<option value="bn">

বাংলা

</option>


<option value="en">

English

</option>


</select>




<select id="practiceMode">


<option value="word">

Word Practice

</option>


<option value="sentence">

Sentence Practice

Paragraph Practice

</option>

</option>

class="typing-display">

</div>





<textarea

id="typingInput"

placeholder="এখানে টাইপ করুন..."

spellcheck="false">

</textarea>







<div class="stats">


<div class="stat">

Time

<span id="time">
0
</span>

</div>



<div class="stat">

WPM

<span id="wpm">
0
</span>

</div>




<div class="stat">

Accuracy

<span id="accuracy">
100%
</span>

</div>




<div class="stat">

Error

<span id="error">

</span>

</div>


</div>

<script>

/****************************************************
 Typing Job Pro v9.0
 Final Stable JavaScript Engine
 Developed By Rahmotullah
****************************************************/


const database={


bn:{


word:[

"বাংলাদেশ",
"স্বাধীনতা",
"শিক্ষা",
"প্রযুক্তি",
"অধ্যবসায়",
"সাফল্য",
"পরিশ্রম",
"বিশ্বাস",
"মানবতা",
"জ্ঞান"

],


sentence:[

"শিক্ষাই জাতির মেরুদণ্ড।",

"সময় ও স্রোত কারো জন্য অপেক্ষা করে না।",

"পরিশ্রম সৌভাগ্যের প্রসূতি।",

"অধ্যবসায় মানুষের সফলতার চাবিকাঠি।"

],


paragraph:[

"বাংলাদেশ একটি স্বাধীন সার্বভৌম দেশ। এ দেশের মানুষ পরিশ্রমী ও কর্মঠ। শিক্ষার মাধ্যমে একটি জাতি উন্নতির পথে এগিয়ে যায়।"

]


},




en:{


word:[

"Bangladesh",
"Education",
"Technology",
"Success",
"Practice",
"Knowledge"

],


sentence:[

"Practice makes a man perfect.",

"Knowledge is power.",

"Time and tide wait for none."

],


paragraph:[

"Bangladesh is an independent country. Education plays an important role in national development."

]


}


};





/***********************
 BIJOY KEYBOARD
************************/


const bijoy={

'q':'ঙ',
'w':'য',
'e':'ড',
'r':'প',
't':'ট',
'y':'চ',
'u':'জ',
'i':'হ',
'o':'গ',
'p':'ড়',

'a':'ৃ',
's':'ু',
'd':'ি',
'f':'া',
'g':'্',
'h':'ব',
'j':'ক',
'k':'ত',
'l':'দ',

'z':'্র',
'x':'ও',
'c':'ে',
'v':'র',
'b':'ন',
'n':'স',
'm':'ম',

'Q':'ং',
'W':'য়',
'E':'ঢ',
'R':'ফ',
'T':'ঠ',
'Y':'ছ',
'U':'ঝ',
'I':'ঞ',
'O':'ঘ',
'P':'ঢ়',

'A':'র্',
'S':'ূ',
'D':'ী',
'F':'অ',
'G':'।',
'H':'ভ',
'J':'খ',
'K':'থ',
'L':'ধ',

'Z':'্য',
'X':'ৌ',
'C':'ৈ',
'V':'ল',
'B':'ণ',
'N':'ষ',
'M':'শ'

};






/***********************
 ELEMENTS
************************/


const display=
document.getElementById("display");


const input=
document.getElementById("typingInput");


const language=
document.getElementById("language");


const mode=
document.getElementById("practiceMode");


const lesson=
document.getElementById("lessonSelect");


const theme=
document.getElementById("themeSelect");


const font=
document.getElementById("fontSelect");


const fontsize=
document.getElementById("fontSize");



let targetText="";

let lessonIndex=0;

let timer=null;

let startTime=null;

let running=false;

let finished=false;





/***********************
 LOAD LESSON
************************/


function loadText(){


let lang=
language.value;


let type=
mode.value;



if(type==="custom"){


let list=
JSON.parse(
localStorage.getItem("custom_text")
||"[]"
);


targetText=
list[lessonIndex] ||
"কোনো Custom Text নেই";


}

else{


targetText=
database[lang][type][lessonIndex]
||
"";


}



display.textContent=
targetText;


reset();


}





/***********************
 RESET
************************/


function reset(){


clearInterval(timer);


input.value="";


running=false;

finished=false;


startTime=null;


document.getElementById("time").innerText="0";

document.getElementById("wpm").innerText="0";

document.getElementById("accuracy").innerText="100%";

document.getElementById("error").innerText="0";


}





/***********************
 CHECK TYPING
************************/


function checkTyping(){


let typed=input.value;


let correct=0;

let error=0;



for(let i=0;i<typed.length;i++){


if(typed[i]===targetText[i])

correct++;

else

error++;


}



let accuracy=

typed.length?

Math.round(
(correct/typed.length)*100
):

100;



document.getElementById("accuracy")
.innerText=
accuracy+"%";


document.getElementById("error")
.innerText=
error;



display.textContent=
targetText;



if(typed.length>=targetText.length)

finish();


}






/***********************
 INPUT EVENT
************************/


input.addEventListener(
"input",
()=>{


if(!running)

startTimer();



checkTyping();


});






/***********************
 TIMER
************************/


function startTimer(){


running=true;


startTime=
Date.now();



timer=setInterval(()=>{


let sec=

Math.floor(
(Date.now()-startTime)/1000
);



document.getElementById("time")
.innerText=
sec;


calculateWPM();


},1000);


}






/***********************
 WPM
************************/


function calculateWPM(){


let sec=
Number(
document.getElementById("time").innerText
);


if(sec<=0)
return;


let chars=
input.value.length;



let wpm=

Math.round(
(chars/5)/(sec/60)
);



document.getElementById("wpm")
.innerText=
wpm;


}






/***********************
 FINISH
************************/


function finish(){


if(finished)
return;


finished=true;


clearInterval(timer);



saveHistory();



setTimeout(()=>{


alert(

"Completed\n\nWPM : "

+
document.getElementById("wpm").innerText

+

"\nAccuracy : "

+
document.getElementById("accuracy").innerText

);



nextLesson();



},300);


}







/***********************
 NEXT LESSON
************************/


function nextLesson(){


lessonIndex++;


let lang=
language.value;


let type=
mode.value;


let total;


if(type==="custom"){


total=

JSON.parse(
localStorage.getItem("custom_text")
||"[]"
).length;


}

else{


total=
database[lang][type].length;


}



if(lessonIndex>=total)

lessonIndex=0;



lesson.value=
lessonIndex;


loadText();


}






/***********************
 LESSON LIST
************************/


function updateLessons(){


lesson.innerHTML="";


let lang=
language.value;


let type=
mode.value;



let total;


if(type==="custom"){


total=

JSON.parse(
localStorage.getItem("custom_text")
||"[]"
).length;


}

else{


total=
database[lang][type].length;


}



for(let i=0;i<total;i++){


let option=
document.createElement("option");


option.value=i;


option.textContent=
"Lesson "+(i+1);


lesson.appendChild(option);


}



}







/***********************
 CUSTOM TEXT
************************/


function saveCustom(){


let text=
document.getElementById("customText")
.value
.trim();



if(!text)
return;



let data=

JSON.parse(
localStorage.getItem("custom_text")
||"[]"
);



data.push(text);



localStorage.setItem(

"custom_text",

JSON.stringify(data)

);



document.getElementById("customText")
.value="";



alert(
"Custom Text Saved"
);



updateLessons();


}







/***********************
 BIJOY INPUT
************************/


input.addEventListener(
"keydown",
function(e){


if(language.value!=="bn")
return;



if(
e.ctrlKey ||
e.altKey ||
e.key.length>1
)

return;



if(bijoy[e.key]){


e.preventDefault();



let pos=this.selectionStart;



this.value=

this.value.substring(0,pos)

+

bijoy[e.key]

+

this.value.substring(pos);



this.selectionStart=

this.selectionEnd=

pos+1;



this.dispatchEvent(
new Event("input")
);


}


});







/***********************
 SETTINGS
************************/


theme.onchange=function(){


document.documentElement
.setAttribute(
"data-theme",
this.value
);



localStorage.setItem(
"theme",
this.value
);


};




font.onchange=function(){


display.style.fontFamily=this.value;

input.style.fontFamily=this.value;


localStorage.setItem(
"font",
this.value
);


};




fontsize.onchange=function(){


display.style.fontSize=
this.value+"px";


input.style.fontSize=
this.value+"px";


localStorage.setItem(
"size",
this.value
);


};






function applySettings(){


let t=
localStorage.getItem("theme");


if(t){

document.documentElement
.setAttribute(
"data-theme",
t
);

theme.value=t;

}



let f=
localStorage.getItem("font");


if(f){

display.style.fontFamily=f;

input.style.fontFamily=f;

font.value=f;

}



let s=
localStorage.getItem("size");


if(s){

display.style.fontSize=s+"px";

input.style.fontSize=s+"px";

fontsize.value=s;


}



}






/***********************
 CHANGE EVENTS
************************/


language.onchange=function(){

lessonIndex=0;

updateLessons();

loadText();

};



mode.onchange=function(){

lessonIndex=0;

updateLessons();

loadText();

};



lesson.onchange=function(){


lessonIndex=
Number(this.value);


loadText();


};







/***********************
 HISTORY
************************/


function saveHistory(){


let h=

JSON.parse(
localStorage.getItem("history")
||"[]"
);



h.push({

date:new Date()
.toLocaleString(),

wpm:
document.getElementById("wpm").innerText,


accuracy:
document.getElementById("accuracy").innerText


});



localStorage.setItem(
"history",
JSON.stringify(h)
);


}







/***********************
 SETTINGS BUTTON
************************/


function toggleSettings(){


document
.getElementById("settings")
.classList
.toggle("active");


}






/***********************
 START
************************/


window.onload=function(){


applySettings();

updateLessons();

loadText();


};

if("serviceWorker" in navigator){

window.addEventListener(
"load",
()=>{


navigator.serviceWorker.register(
"service-worker.js"
)

.then(()=>{

console.log(
"Typing Job Pro PWA Ready"
);


})


});


}

</script>

</html>
